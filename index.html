<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flyby</title>

  <!-- Icons -->
  <link rel="icon" sizes="32x32" href="/icons/favicon-32x32.png">
  <link rel="icon" sizes="16x16" href="/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/icons/site.webmanifest">

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --text: #111827;
      --muted: #6B7280;
      --primary: #2563EB;
      --radius: 14px;
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: 'Inter', -apple-system, sans-serif;
      color: var(--text);
    }

    #map {
      height: 100%;
      width: 100%;
    }

    /* =========================
       GLASS SYSTEM
    ========================== */
    .glass {
      background: linear-gradient(
        135deg,
        rgba(255,255,255,0.6),
        rgba(255,255,255,0.2)
      );

      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);

      border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,0.25);

      box-shadow:
        0 6px 20px rgba(0,0,0,0.1),
        inset 0 1px 0 rgba(255,255,255,0.35);
    }

    .glass,
    .glass-control,
    #panel-close {
      transition: transform 0.2s ease, background 0.2s ease;
    }

    /* =========================
       MAP CONTROLS
    ========================== */
    .glass-control {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 6px;
      padding: 6px 10px;
      min-height: 30px;
    }

    .map-value {
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.2px;
    }

    .map-select {
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 12px;

      height: 24px;
      padding: 0;

      outline: none;
      cursor: pointer;
      text-align: center;

      max-width: 180px;
    }

    /* stack spacing */
.leaflet-top.leaflet-right {
  display: flex;
  flex-direction: row;
  gap: 6px;
}

    /* =========================
       PANEL
    ========================== */
    #flight-panel {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 2000;
      margin-right: 0;
      margin-top: 4px;

      padding: 14px;
      display: none;

      transform: translateY(20px);
      opacity: 0;
    }

    #flight-panel.show {
      transform: translateY(0);
      opacity: 1;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    #flight-title {
      font-weight: 600;
      font-size: 14px;
    }

    #flight-sub {
      font-size: 12px;
      color: var(--muted);
    }

    #panel-close {
      border: none;
      background: rgba(0,0,0,0.05);
      border-radius: 10px;
      padding: 6px 10px;
      cursor: pointer;
    }

    /* =========================
       STATS (ONE LINE)
    ========================== */
    #flight-stats {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      gap: 10px;
    }

    .stat {
      display: flex;
      gap: 4px;
    }

    .stat .k {
      color: var(--muted);
    }

    .stat .v {
      font-weight: 600;
    }

    /* =========================
       CHART
    ========================== */
    #chart-wrap {
      margin-top: 10px;
    }

    #chart {
      width: 100%;
      height: 140px;
      background: transparent;
    }

    #legend {
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
      display: flex;
      gap: 12px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px;
    }

    /* =========================
       SLIDER
    ========================== */
    #scrub-wrap {
      margin-top: 10px;
    }

    #scrubber {
      width: 100%;
      accent-color: var(--primary);
    }
/* =========================
   ZOOM = SAME GLASS AS UI
========================= */

/* container = SAME as .glass */

.leaflet-bar {
  border: none !important;
  background: transparent;
  box-shadow:
  0 6px 20px rgba(0,0,0,0.1),
  inset 0 1px 0 rgba(255,255,255,0.4),
  inset 0 -1px 0 rgba(255,255,255,0.1);
}

.leaflet-control-zoom {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 6px;

  background: linear-gradient(
    135deg,
    rgba(255,255,255,0.6),
    rgba(255,255,255,0.2)
  );

  backdrop-filter: blur(12px) saturate(140%);
  -webkit-backdrop-filter: blur(12px) saturate(140%);

  border-radius: 14px; /* 🔥 EXACT same as your UI */
  border: none;

}

/* buttons = transparent content inside glass */
.leaflet-control-zoom a {
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
  outline: none;

  width: 24px;
  height: 24px;
  line-height: 24px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 10px; /* inner softness like your controls */

  font-family: inherit;
  font-size: 16px;
  font-weight: 600;
  color: #111827;

  transition: background 0.2s ease, transform 0.2s ease;
}

/* hover = same feel */
.leaflet-control-zoom a:hover {
  background: rgba(255,255,255,0.3);
  transform: translateY(-1px);
}

/* remove default divider */
.leaflet-control-zoom-in {
  border-bottom: none !important;
}

    /* =========================
       MOBILE LANDSCAPE
    ========================== */
@media (orientation: landscape) and (max-height: 500px) {

  #flight-panel {
    top: 60px;                /* 🔥 below controls */
    right: 10px;
    left: auto;               /* 🔥 move from left → right */

    width: min(320px, 40vw);
    padding: 10px;

    max-height: 70vh;
    overflow-y: auto;
  }
}
  </style>
</head>

<body>
  <div id="map"></div>

  <div id="flight-panel" class="glass">
    <div class="panel-header">
      <div>
        <div id="flight-title"></div>
        <div id="flight-sub"></div>
      </div>
      <button id="panel-close">Close</button>
    </div>

    <div id="flight-stats">
      <div class="stat"><span class="k">Time</span><span class="v" id="stat-time">—</span></div>
      <div class="stat"><span class="k">HDG</span><span class="v" id="stat-hdg">—</span></div>
      <div class="stat"><span class="k">Alt</span><span class="v" id="stat-alt">—</span></div>
      <div class="stat"><span class="k">Spd</span><span class="v" id="stat-gs">—</span></div>
    </div>

    <div id="chart-wrap">
      <canvas id="chart"></canvas>
      <div id="legend">
        <span><span class="dot" style="background:#2E7D32;"></span>Alt</span>
        <span><span class="dot" style="background:#1565C0;"></span>Spd</span>
      </div>
    </div>

    <div id="scrub-wrap">
      <input id="scrubber" type="range"/>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
