<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flyby</title>

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/icons/site.webmanifest">

  <!-- Font (modern) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    /* =========================
       GLOBAL SYSTEM
    ========================== */
    :root {
      --bg: rgba(255,255,255,0.85);
      --border: rgba(0,0,0,0.06);
      --text: #111827;
      --muted: #6B7280;
      --primary: #2563EB;
      --accent: #F59E0B;

      --radius: 14px;
      --shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    * {
      box-sizing: border-box;
      transition: all 0.2s ease;
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: 'Inter', -apple-system, sans-serif;
      color: var(--text);
      background: #f9fafb;
    }

    #map {
      height: 100%;
      width: 100%;
    }

    /* =========================
       SHARED GLASS COMPONENT
    ========================== */
  .glass {
    background: linear-gradient(
      135deg,
      rgba(255,255,255,0.6),
      rgba(255,255,255,0.2)
    );

  backdrop-filter: blur(16px) saturate(160%);
  -webkit-backdrop-filter: blur(16px) saturate(160%);

  border-radius: var(--radius);

  border: 1px solid rgba(255,255,255,0.25);

  box-shadow:
    0 8px 32px rgba(0,0,0,0.12),
    inset 0 1px 0 rgba(255,255,255,0.4);
}

    /* =========================
       PANEL (MAIN UI)
    ========================== */
    #flight-panel {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 2000;

      padding: 14px;
      display: none;

      transform: translateY(20px);
      opacity: 0;
    }

    #flight-panel.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* HEADER */
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    #flight-title {
      font-weight: 600;
      font-size: 15px;
    }

    #flight-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    #panel-close {
      border: none;
      background: rgba(0,0,0,0.05);
      border-radius: 10px;
      padding: 6px 10px;
      cursor: pointer;
      font-weight: 500;
    }

    #panel-close:hover {
      background: rgba(0,0,0,0.08);
    }

    /* =========================
       STATS (minimal version)
    ========================== */
    #flight-stats {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      gap: 10px;
    }

    .stat {
      display: flex;
      gap: 4px;
    }

    .stat .k {
      color: var(--muted);
    }

    .stat .v {
      font-weight: 600;
    }

    /* =========================
       CHART
    ========================== */
    #chart-wrap {
      margin-top: 12px;
    }

    #chart {
      width: 100%;
      height: 140px;
      border-radius: 10px;
      background: transparent;
    }

    #legend {
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
      display: flex;
      gap: 12px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px;
    }

    /* =========================
       SLIDER
    ========================== */
    #scrub-wrap {
      margin-top: 10px;
    }

    #scrubber {
      width: 100%;
      accent-color: var(--primary);
    }

    /* =========================
       LANDSCAPE MODE (PHONE)
    ========================== */
    @media (orientation: landscape) and (max-height: 500px) {
      #flight-panel {
        top: 12px;
        bottom: 12px;
        left: 12px;
        right: auto;
        width: min(360px, 40vw);
        overflow-y: auto;
      }

      #chart {
        height: 110px;
      }
    }
/* =========================
   MAP CONTROLS (TOP RIGHT)
========================= */

.map-control {
  background: var(--bg);
  backdrop-filter: blur(12px);
  border-radius: 12px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  padding: 10px;
  font-size: 12px;
  min-width: 105px;
}

/* label */
.map-control-title {
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 6px;
  font-weight: 500;
}

/* dropdown */
.map-select {
  width: 100%;
  padding: 6px 8px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: rgba(255, 255, 255, 0);
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
}

.map-select:focus {
  outline: none;
  border-color: var(--primary);
}

/* distance box */
.distance-box {
  margin-top: 8px;
}

.distance-label {
  font-size: 10px;
  color: var(--muted);
}

.distance-value {
  font-weight: 600;
  font-size: 13px;
  margin-top: 2px;
}

.row-control {
  display: flex;
  align-items: center;
  gap: 8px;
}

.map-inline-label {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}

.map-select.inline {
  flex: 1;
  font-size: 12px;
  height: 28px;
}

.distance-inline {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.distance-label-inline {
  font-size: 12px;
  color: var(--muted);
}

.distance-value-inline {
  font-size: 12px;
  font-weight: 600;
}
  </style>
</head>

<body>
  <div id="map"></div>

  <div id="flight-panel" class="glass">
    <div class="panel-header">
      <div>
        <div id="flight-title"></div>
        <div id="flight-sub"></div>
      </div>
      <button id="panel-close">Close</button>
    </div>

    <div id="flight-stats">
      <div class="stat"><span class="k">Time</span><span class="v" id="stat-time">—</span></div>
      <div class="stat"><span class="k">Heading</span><span class="v" id="stat-hdg">—</span></div>
      <div class="stat"><span class="k">Altitude</span><span class="v" id="stat-alt">—</span></div>
      <div class="stat"><span class="k">Speed</span><span class="v" id="stat-gs">—</span></div>
    </div>

    <div id="chart-wrap">
      <canvas id="chart"></canvas>
      <div id="legend">
        <span><span class="dot" style="background:#2563EB;"></span>Altitude</span>
        <span><span class="dot" style="background:#F59E0B;"></span>Speed</span>
      </div>
    </div>

    <div id="scrub-wrap">
      <input id="scrubber" type="range" min="0" max="0" value="0" step="1"/>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
